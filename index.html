    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #C41E3A;
            --maroon: #800020;
            --gold: #D4A017;
            --cream: #F5E6CC;
            --warm-white: #FFF8F0;
            --dark: #2D1810;
            --green: #2E7D32;
            --saffron: #FF6600;
        }

        body {
            font-family: 'Noto Sans Devanagari', 'Tiro Devanagari Hindi', sans-serif;
            color: var(--dark);
            background: var(--warm-white);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Hero ---- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--maroon) 0%, var(--red) 50%, var(--maroon) 100%);
            color: var(--warm-white);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(212,160,23,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212,160,23,0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Rangoli-inspired decorative corners */
        .hero::after {
            content: '';
            position: absolute;
            inset: 1.5rem;
            border: 1px solid rgba(212,160,23,0.25);
            border-radius: 1rem;
            pointer-events: none;
        }

        .hero-om {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            letter-spacing: 0.5rem;
        }

        .hero h1 {
            font-family: 'Yatra One', cursive;
            font-size: clamp(3rem, 8vw, 5.5rem);
            color: var(--gold);
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .hero .subtitle-en {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 3vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,248,240,0.85);
            margin-bottom: 1rem;
        }

        .hero .tagline {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--cream);
            font-style: italic;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .hero .tagline-desc {
            font-size: 0.95rem;
            color: rgba(255,248,240,0.7);
            max-width: 500px;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
        }

        .btn:hover {
            background: var(--gold);
            color: var(--maroon);
        }

        .btn-solid {
            background: var(--gold);
            color: var(--maroon);
            border-color: var(--gold);
        }

        .btn-solid:hover {
            background: #b8890f;
            border-color: #b8890f;
        }

        /* ---- Responsive ---- */
        @media (max-width: 600px) {
            .hero {
                min-height: 90vh;
                padding: 1.5rem;
            }

            .hero::after {
                inset: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Hero -->
    <section class="hero">
        <h1>विवाह मंगलम्</h1>
    </section>

</body>
